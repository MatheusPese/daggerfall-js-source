name: release-desktop

on:
  push:
    tags:
      - 'app-v*'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create a Release at (app-v*); empty = run artifacts only'
        required: false
        default: ''
      run_full_check:
        description: 'Run full test suite & check (false = test changed files only)'
        required: false
        type: boolean
        default: true
      target_os:
        description: 'Target OS to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest
      compression:
        description: 'High-compression format for download artifact (zstd / 7z)'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - zstd
          - 7z

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-desktop-main' || format('release-desktop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.reltag.outputs.tag }}
      version: ${{ steps.reltag.outputs.version }}
      update: ${{ steps.reltag.outputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: reltag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -z "$TAG" ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            BASE=$(node -p "require('./app/package.json').version.split('.').slice(0,2).join('.')")
            TAG="app-v${BASE}.$(git rev-list --count HEAD)"
          fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be app-v<major>.<minor>.<patch>, digits only"
            exit 1
          fi
          VERSION="${TAG#app-v}"
          UPDATE=$(node scripts/updateNumber.mjs)
          if [ -n "$UPDATE" ] && ! [[ "$UPDATE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the update number must be <major>.<minor>.<patch>, digits only"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "update=$UPDATE" >> "$GITHUB_OUTPUT"
          echo "release tag: '${TAG:-<none - artifacts only>}'"

  select-os:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          TARGET="${{ inputs.target_os }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            echo 'matrix={"os": ["ubuntu-latest", "windows-latest", "macos-latest"]}' >> $GITHUB_OUTPUT
          else
            echo "matrix={\"os\": [\"$TARGET\"]}" >> $GITHUB_OUTPUT
          fi

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install site dependencies
        run: npm ci

      - name: Run Lint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_full_check == true }}
        run: npm run lint

      - name: Run Type Check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_full_check == true }}
        run: npm run typecheck

      - name: Run Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_full_check == true }}
        run: npm test

      - name: Run Fast Changed-Files Test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_check == false }}
        run: npm run test:changed

  build-site:
    needs: [version, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install site dependencies
        run: npm ci
      - name: Build the site
        env:
          DFO_UPDATE: ${{ needs.version.outputs.update }}
        run: npm run build
      - name: Upload site dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 1

  build:
    needs: [version, build-site, select-os]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-os.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron Builder & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            %LOCALAPPDATA%/electron/Cache
            %LOCALAPPDATA%/electron-builder/Cache
            app/node_modules
          key: ${{ runner.os }}-electron-${{ hashFiles('app/package-lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Install shell dependencies
        run: npm ci
        working-directory: app

      - name: Stamp the version
        if: needs.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        working-directory: app

      - name: No updater in a build that is not a release
        if: needs.version.outputs.tag == ''
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.publish=null;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        working-directory: app

      - name: Build installers
        run: npx electron-builder --publish never
        working-directory: app

      - name: Create High-Compression Archive (Optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compression != 'standard' && inputs.compression != '' }}
        shell: bash
        run: |
          cd app/release
          if [ "${{ inputs.compression }}" = "zstd" ]; then
            echo "Compressing installers with zstd..."
            if command -v brew &> /dev/null; then brew install zstd; fi
            if command -v apt-get &> /dev/null; then sudo apt-get update && sudo apt-get install -y zstd; fi
            zstd -T0 -19 *.AppImage *.exe *.dmg 2>/dev/null || true
          elif [ "${{ inputs.compression }}" = "7z" ]; then
            echo "Compressing installers with 7z..."
            if command -v brew &> /dev/null; then brew install p7zip; fi
            if command -v apt-get &> /dev/null; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
            7z a -t7z -mx=9 desktop-bundle-${{ matrix.os }}.7z *.AppImage *.exe *.dmg 2>/dev/null || true
          fi

      - name: Hand the installers on
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            app/release/*.AppImage
            app/release/*.exe
            app/release/*.dmg
            app/release/latest*.yml
            app/release/*.blockmap
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.tag != '' && 1 || 14 }}

      - name: Upload Compressed Bundle Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compression != 'standard' && inputs.compression != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-compressed-${{ matrix.os }}
          path: |
            app/release/*.zst
            app/release/*.7z
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Collect every leg's files
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Copies under the names older copies ask for
        run: node scripts/desktopRelease.mjs alias release

      - name: The set is whole
        run: node scripts/desktopRelease.mjs check release

      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/desktopRelease.mjs notes "$TAG" > release-notes.md

      - name: The tag has no published release, and no draft left over
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>lookup-error.txt; then
            echo "::error::$TAG is already published - a release is never re-cut in place; cut a new tag"
            exit 1
          fi
          grep -q 'HTTP 404' lookup-error.txt || { cat lookup-error.txt >&2; exit 1; }
          LEFT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')
          for ID in $LEFT; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID" --silent
            echo "deleted draft $ID, left at $TAG by an earlier run"
          done

      - name: Stage the release as a draft, every file attached
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.update != '' && format('Update {0}', needs.version.outputs.update) || needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

      - name: Publish it whole
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          if CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>latest-error.txt); then :
          elif grep -q 'HTTP 404' latest-error.txt; then CURRENT=''
          else cat latest-error.txt >&2; exit 1
          fi
          MAKE_LATEST=$(node scripts/desktopRelease.mjs latest "$TAG" "$CURRENT")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest="$MAKE_LATEST" --silent
          echo "published $TAG (latest: $MAKE_LATEST)"
